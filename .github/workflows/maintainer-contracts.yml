name: Maintainer contracts

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-evidence:
    name: Review evidence contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base policy and action
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Evaluate the repository contract
        uses: ./
        with:
          config: .github/maintainer-contracts.json
          token: ${{ github.token }}
          report-dir: .maintainer-contracts
          github-annotations: "true"

      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintainer-contracts-report
          path: .maintainer-contracts
          if-no-files-found: warn
          retention-days: 14
